services:
  app:
    build: .
    container_name: finscout-app
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./memos:/app/memos
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    container_name: finscout-scheduler
    env_file: .env
    volumes:
      - ./app:/app/app
    command: python -m app.jobs.scheduler
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: finscout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
